<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Teacher Jobs · 한국어교육 채용정보 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1F2937;
    --primary-dark: #111827;
    --primary-light: #475569;
    --accent: #F59E0B;
    --accent-soft: #FCD34D;
    --success: #2A9D8F;
    --warning: #E9C46A;
    --bg: #FAFAFA;
    --bg-soft: #FFFFFF;
    --card: #FFFFFF;
    --text: #1A1A2E;
    --text-secondary: #6B7280;
    --text-light: #9CA3AF;
    --border: #E5E7EB;
    --border-soft: #F3F4F6;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 2px 8px rgba(30, 58, 95, 0.08);
    --shadow-lg: 0 8px 32px rgba(30, 58, 95, 0.12);
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Noto Sans KR', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  a { color: inherit; text-decoration: none; }
  input { font-family: inherit; }

  /* === Header === */
  header {
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
    background: rgba(255,255,255,0.95);
  }
  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px 24px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 24px;
  }
  .logo { display: flex; align-items: center; gap: 10px; justify-self: start; }
  .logo-mark {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 900;
    font-size: 18px;
    font-family: 'Inter';
  }
  .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
  .logo-en { font-weight: 700; font-size: 17px; color: var(--primary); font-family: 'Inter'; }
  .logo-ko { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  nav ul { display: flex; list-style: none; gap: 60px; align-items: center; }
  nav { justify-self: center; }
  nav a {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    transition: color 0.2s;
  }
  nav a:hover { color: var(--accent); }
  .header-actions { display: flex; gap: 8px; align-items: center; justify-self: end; }
  .btn-ghost {
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    border-radius: 8px;
    transition: background 0.2s;
  }
  .btn-ghost:hover { background: var(--border-soft); }
  .btn-primary {
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 600;
    background: var(--primary);
    color: white;
    border-radius: 8px;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-bookmark {
    padding: 8px 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    background: var(--border-soft);
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
    border: 1.5px solid transparent;
  }
  .btn-bookmark:hover {
    background: white;
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn-bookmark.has-saved {
    background: #FEF3C7;
    color: #92400E;
  }
  .btn-bookmark.has-saved:hover {
    background: #FDE68A;
  }

  /* === Hero === */
  .hero {
    background: linear-gradient(180deg, #FFFFFF 0%, var(--bg) 100%);
    padding: 40px 24px 28px;
  }
  .hero-inner {
    max-width: 1280px;
    margin: 0 auto;
    text-align: center;
  }
  .hero h1 {
    font-size: 32px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 12px;
  }
  .hero p {
    font-size: 15px;
    color: var(--text-secondary);
    margin-bottom: 22px;
  }
  .search-box {
    max-width: 640px;
    margin: 0 auto 20px;
    background: white;
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 6px 6px 6px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
    transition: border-color 0.2s;
  }
  .search-box:focus-within { border-color: var(--primary-light); }
  .search-box svg { color: var(--text-light); flex-shrink: 0; }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    padding: 12px 0;
    background: transparent;
    color: var(--text);
  }
  .search-box input::placeholder { color: var(--text-light); }
  .search-btn {
    padding: 12px 28px;
    background: var(--primary);
    color: white;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    transition: background 0.2s;
  }
  .search-btn:hover { background: var(--primary-dark); }
  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 12px;
  }
  .hero-stats strong { color: var(--accent); font-weight: 700; }

  /* === Quick filters === */
  .quick-filters {
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
    padding: 16px 0;
    position: sticky;
    top: 69px;
    z-index: 50;
  }
  .quick-filters-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .quick-filters-inner::-webkit-scrollbar { display: none; }
  .chip {
    padding: 8px 16px;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    background: white;
    white-space: nowrap;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .chip:hover { border-color: var(--primary-light); color: var(--primary); }
  .chip.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .chip-icon { margin-right: 4px; }

  /* === Main layout === */
  .main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px;
  }
  .main > section { display: block; width: 100%; }

  /* === Sidebar filters === */
  /* === 가로 필터 박스 === */
  .filter-bar {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .filter-bar-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-right: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .filter-panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    min-width: 240px;
    max-height: 420px;
    overflow-y: auto;
    box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    z-index: 50;
  }
  .fb-search {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    background: var(--bg);
    border-radius: 10px;
    min-width: 240px;
    border: 1px solid transparent;
    transition: border-color 0.15s;
  }
  .fb-search:focus-within { border-color: var(--primary-light); }
  .fb-search svg { color: var(--text-light); flex-shrink: 0; }
  .fb-search input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    padding: 6px 0;
  }
  .fb-search input::placeholder { color: var(--text-light); }
  .fb-divider {
    width: 1px;
    height: 24px;
    background: var(--border);
  }
  .reset-link {
    padding: 6px 12px;
    font-size: 12.5px;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
    transition: color 0.15s;
  }
  .reset-link:hover { color: var(--primary); }

  
  /* filter-group을 가로 드롭다운으로 */
  details.filter-group {
    position: relative;
    border: none;
    padding: 0;
  }
  details.filter-group > summary {
    list-style: none;
    cursor: pointer;
    padding: 8px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text);
    background: white;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    user-select: none;
    transition: all 0.15s;
  }
  details.filter-group > summary::-webkit-details-marker { display: none; }
  details.filter-group > summary::after {
    content: "▾";
    font-size: 10px;
    color: var(--text-light);
    margin-left: 2px;
  }
  details.filter-group[open] > summary {
    border-color: var(--primary);
    background: var(--bg);
  }
  details.filter-group[open] > summary::after { content: "▴"; color: var(--text); }
  details.filter-group > summary:hover { border-color: var(--primary-light); }

  .filter-list { display: flex; flex-direction: column; gap: 6px; }
  .region-tree { display: flex; flex-direction: column; gap: 4px; }
  .region-section { border-radius: 6px; }
  .region-section > .region-summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    font-size: 13.5px;
    color: var(--text);
    font-weight: 500;
    border-radius: 6px;
    user-select: none;
  }
  .region-section > .region-summary::-webkit-details-marker { display: none; }
  .region-section > .region-summary:hover { background: var(--border-soft); }
  .region-chevron {
    display: inline-block;
    font-size: 10px;
    color: var(--text-secondary);
    transition: transform 0.15s;
    width: 10px;
  }
  .region-section[open] > .region-summary .region-chevron { transform: rotate(90deg); }
  .region-section .region-label { flex: 1; }
  .region-section .region-children {
    padding: 4px 0 4px 20px;
    gap: 4px;
  }
  .region-flat-list { padding-left: 0; }
  .region-section .filter-item { font-size: 13px; }
  .filter-subhead {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
    margin: 12px 0 4px 2px;
  }
  .filter-group > .filter-subhead:first-of-type { margin-top: 4px; }
  .filter-item.is-hidden { display: none; }
  /* 0건이어도 표시되는 시·도 항목은 살짝 흐리게 */
  .filter-item[data-keep-empty="1"][data-count="0"] { color: var(--text-light); }
  .filter-item[data-keep-empty="1"][data-count="0"] .count { opacity: 0.5; }
  .filter-item {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 13.5px;
    color: var(--text);
    transition: background 0.15s;
  }
  .filter-item:hover { background: var(--border-soft); }
  .filter-item input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--primary);
    cursor: pointer;
  }
  .filter-item .count {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-light);
  }
  .reset-link { margin-left: 4px; }
  .reset-btn {
    margin-left: auto;
    padding: 8px 14px;
    font-size: 12.5px;
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
    cursor: pointer;
    transition: all 0.15s;
  }
  .reset-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* === Results === */
  .results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .results-count {
    font-size: 14px;
    color: var(--text-secondary);
  }
  .results-count strong { color: var(--primary); font-weight: 700; }
  .sort-select {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    background: white;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
  }

  /* === Card grid === */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    position: relative;
  }
  .card:hover {
    border-color: var(--primary-light);
    box-shadow: var(--shadow-lg);
    transform: translateY(-2px);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
  }
  .card-institution {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--primary);
    cursor: pointer;
    transition: color 0.15s;
  }
  .card-institution:hover {
    color: var(--accent);
    text-decoration: underline;
  }
  .bookmark-btn {
    color: var(--text-light);
    padding: 2px;
    transition: color 0.15s;
  }
  .bookmark-btn:hover { color: var(--accent); }
  .bookmark-btn.active { color: var(--accent); }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 44px;
  }
  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .tag {
    font-size: 11.5px;
    padding: 3px 9px;
    background: var(--border-soft);
    color: var(--text-secondary);
    border-radius: 999px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .card-meta {
    border-top: 1px dashed var(--border);
    padding-top: 10px;
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .meta-line {
    font-size: 12.5px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .meta-line strong { color: var(--text); font-weight: 600; }
  .card-salary {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-top: 12px;
  }
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 10px;
  }
  .badge {
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }
  .badge.salary { background: #DCFCE7; color: #166534; }
  .badge.visa { background: #E0E7FF; color: #3730A3; }
  .badge.urgent { background: #FEE2E2; color: #991B1B; }
  .badge.junior { background: #FEF3C7; color: #92400E; }
  .badge.verified { background: #E0F2FE; color: #075985; }
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border-soft);
  }
  .deadline {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
  }
  .deadline.normal { color: var(--text-secondary); font-weight: 600; }
  .view-btn {
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    padding: 6px 12px;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .view-btn:hover { background: var(--border-soft); }

  /* === Newsletter === */
  .newsletter {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
    padding: 56px 24px;
    margin-top: 64px;
  }
  .newsletter-inner {
    max-width: 720px;
    margin: 0 auto;
    text-align: center;
  }
  .newsletter h2 {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .newsletter p {
    color: rgba(255,255,255,0.85);
    margin-bottom: 24px;
  }
  .newsletter-form {
    display: flex;
    gap: 8px;
    max-width: 480px;
    margin: 0 auto;
  }
  .newsletter-form input {
    flex: 1;
    padding: 14px 18px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
  }
  .newsletter-form button {
    padding: 14px 24px;
    background: var(--accent);
    color: white;
    border-radius: 10px;
    font-weight: 700;
    transition: background 0.2s;
  }
  .newsletter-form button:hover { background: #d05a3e; }

  /* === Footer === */
  footer {
    background: var(--primary-dark);
    color: rgba(255,255,255,0.7);
    padding: 32px 24px;
    text-align: center;
    font-size: 13px;
  }
  footer a { color: rgba(255,255,255,0.9); margin: 0 12px; }

  /* === Modal === */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    display: none;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    padding: 40px 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: white;
    border-radius: 16px;
    max-width: 720px;
    width: 100%;
    padding: 32px;
    position: relative;
    box-shadow: var(--shadow-lg);
    margin: auto;
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .modal-close:hover { background: var(--border); }
  .modal h2 {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 6px;
    padding-right: 40px;
  }
  .modal-original-title {
    font-size: 13px;
    color: var(--text-light);
    margin-top: -4px;
    margin-bottom: 14px;
    font-weight: 400;
    line-height: 1.5;
    padding-left: 8px;
    border-left: 2px solid var(--border);
  }
  .modal-institution {
    color: var(--primary);
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .modal-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }
  .modal-section {
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border-soft);
  }
  .modal-section:last-child { border-bottom: none; }
  .modal-section h4 {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .modal-section p, .modal-section li {
    font-size: 14.5px;
    color: var(--text);
    line-height: 1.65;
  }
  .modal-section ul { padding-left: 18px; }
  .modal-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 20px;
  }
  .modal-grid-item .label {
    font-size: 11.5px;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .modal-grid-item .value {
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
    margin-top: 2px;
  }
  .modal-cta {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }
  .modal-cta a, .modal-cta button {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14.5px;
    text-align: center;
    transition: all 0.2s;
  }
  .modal-cta .primary-cta {
    background: var(--primary);
    color: white;
  }
  .modal-cta .primary-cta:hover { background: var(--primary-dark); }
  .modal-cta .secondary-cta {

<script src="data.js"></script>
<script>
// === Render ===
const grid = document.getElementById('grid');
let activeQuickFilter = 'all';
let activeFilters = {};
let currentMode = 'teacher';

// === Bookmark ===
const BOOKMARK_KEY = 'ktj_bookmarks';
const TOAST_SEEN_KEY = 'ktj_seen_bookmark_toast';
let bookmarks = JSON.parse(localStorage.getItem(BOOKMARK_KEY) || '[]');
function isBookmarked(id) { return bookmarks.includes(id); }
function toggleBookmark(id) {
  if (bookmarks.includes(id)) bookmarks = bookmarks.filter(b => b !== id);
  else { bookmarks.push(id); if (!localStorage.getItem(TOAST_SEEN_KEY)) { showBookmarkToast(); localStorage.setItem(TOAST_SEEN_KEY, '1'); } }
  localStorage.setItem(BOOKMARK_KEY, JSON.stringify(bookmarks));
  updateHeaderBookmarkCount();
  renderGrid();
}
function updateHeaderBookmarkCount() {
  const cnt = document.getElementById('headerBookmarkCount');
  const btn = document.querySelector('.btn-bookmark');
  if (!cnt || !btn) return;
  cnt.textContent = `저장함 ${bookmarks.length}`;
  if (bookmarks.length > 0) btn.classList.add('has-saved');
  else btn.classList.remove('has-saved');
}
function showBookmarked() {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  activeQuickFilter = 'bookmarked';
  renderGrid();
  document.getElementById('grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function showBookmarkToast() {
  const toast = document.createElement('div');
  toast.className = 'bookmark-toast';
  toast.innerHTML = '🔖 저장됐어요!<span class="small">이 책갈피는 <strong>당신의 브라우저에만</strong> 저장돼요.</span>';
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 4000);
}

// === Helpers ===
function deadlineText(d) {
  if (d <= 0) return { text: '마감', urgent: false };
  if (d <= 7) return { text: `D-${d}`, urgent: true };
  return { text: `D-${d}`, urgent: false };
}
function countryIcon(c) {
  const map = { '한국': '🇰🇷', '미국': '🇺🇸', '일본': '🇯🇵', '캐나다': '🇨🇦', '호주': '🇦🇺', '베트남': '🇻🇳', '영국': '🇬🇧', '온라인': '💻' };
  return map[c] || '🌐';
}
function modeIcon(m) {
  if (m === '온라인') return '💻';
  if (m === '하이브리드') return '🔄';
  return '🏢';
}

function renderCard(job) {
  const inst = institutions[job.inst];
  const dl = deadlineText(job.deadline);
  return `
    <div class="card" data-id="${job.id}">
      <div class="card-top">
        <span class="card-institution" onclick="event.stopPropagation(); openInstitution('${job.inst}')">${inst ? inst.name : ''}</span>
        <button class="bookmark-btn ${isBookmarked(job.id) ? 'active' : ''}" onclick="event.stopPropagation(); toggleBookmark(${job.id})">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="${isBookmarked(job.id) ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>
      <h3 class="card-title">${job.title}</h3>
      <div class="card-meta">
        <div class="meta-line">${countryIcon(job.country)} ${job.country}${job.region && job.country !== '온라인' ? ' · ' + job.region : ''}</div>
        <div class="meta-line">🏫 ${job.type}</div>
      </div>
      <div class="card-salary">${job.salaryDisclosed ? job.salary : '급여 비공개'}</div>
      <div class="card-footer">
        <span class="deadline ${dl.urgent ? 'urgent' : 'normal'}">⏰ ${dl.text}</span>
        <button class="view-btn">자세히 보기 →</button>
      </div>
    </div>`;
}

function renderGrid() {
  let filtered = jobs.filter(matchesFilters);
  document.getElementById('resultCount').textContent = filtered.length;
  const activeCountEl = document.getElementById('activeCount');
  if (activeCountEl) activeCountEl.textContent = filtered.length + '건';

  // sort
  const sort = document.getElementById('sortSelect').value;
  if (sort === 'deadline') filtered.sort((a,b) => a.deadline - b.deadline);
  // latest = 기본 순서 유지

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>조건에 맞는 공고가 없어요</p><p style="margin-top:8px; font-size:13px;">필터를 줄이거나 다른 조건으로 검색해보세요</p></div>`;
  } else {
    grid.innerHTML = filtered.map(renderCard).join('');
    grid.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openJob(parseInt(card.dataset.id)));
    });
  }
}

function matchesFilters(job) {
  // 모드 매칭 (A안: 강사 vs 기타직)
  if (currentMode === 'teacher' && job.category !== '강사') return false;
  if (currentMode === 'other' && job.category === '강사') return false;
  // search
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (q) {
    const inst = institutions[job.inst];
    const haystack = (job.title + ' ' + inst.name + ' ' + job.region + ' ' + job.type + ' ' + job.country).toLowerCase();
    if (!haystack.includes(q)) return false;
  }
  // quick filter (chips)
  if (activeQuickFilter !== 'all') {
    if (activeQuickFilter.startsWith('type:')) {
      if (job.type !== activeQuickFilter.slice(5)) return false;
    } else if (activeQuickFilter === 'bookmarked' && !bookmarks.includes(job.id)) return false;
    else if (activeQuickFilter === 'admin' && job.category !== '행정·운영') return false;
    else if (activeQuickFilter === 'publishing' && job.category !== '교재·출판') return false;
    else if (activeQuickFilter === 'content' && job.category !== '콘텐츠 제작') return false;
    else if (activeQuickFilter === 'research' && job.category !== '연구·평가') return false;
    else if (activeQuickFilter === 'policy' && job.category !== '정책·국제교류') return false;
  }
  // sidebar filters
  for (const key in activeFilters) {
    const vals = activeFilters[key];
    if (!vals.length) continue;
    if (key === 'region') {
      const ok = vals.some(v => regionMatches(job, v));
      if (!ok) return false;
    }
    if (key === 'employment' && !vals.includes(job.employment)) return false;
    if (key === 'cert' && !vals.includes(job.cert)) return false;
    if (key === 'degree' && !vals.some(v => matchesDegree(job, v))) return false;
    if (key === 'experience' && !vals.includes(job.experience)) return false;
    if (key === 'badge' && !vals.some(b => job.badges.includes(b))) return false;
  }
  return true;
}

// 지역 매칭 헬퍼
function getSido(region) {
  if (!region) return '';
  return region.trim().split(/\s+/)[0];
}
function matchesDegree(job, val) {
  const j = job.degree || '무관';
  if (val === '무관') return j === '무관' || j === '학사';
  if (val === '석사이상') return j === '석사' || j === '박사수료' || j === '박사';
  if (val === '박사수료이상') return j === '박사수료' || j === '박사';
  if (val === '박사이상') return j === '박사';
  return false;
}
function regionMatches(job, val) {
  if (val === 'online') return job.country === '온라인';
  if (val.startsWith('kr-')) {
    if (job.country !== '한국') return false;
    return getSido(job.region) === val.slice(3);
  }
  if (val.startsWith('ov-')) {
    return job.country === val.slice(3);
  }
  return false;
}

// === Filter events ===
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeQuickFilter = chip.dataset.quick;
    renderGrid();
  });
});
// (사이드바 input 이벤트는 하단에서 위임 방식으로 처리 - 동적 생성된 지역 항목 대응)
document.getElementById('resetBtn').addEventListener('click', () => {
  document.querySelectorAll('.filter-item input').forEach(i => i.checked = false);
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  document.querySelector('.chip[data-quick="all"]').classList.add('active');
  activeFilters = {};
  activeQuickFilter = 'all';
  document.getElementById('searchInput').value = '';
  renderGrid();
});
document.getElementById('searchInput').addEventListener('input', renderGrid);
document.getElementById('sortSelect').addEventListener('change', renderGrid);

// === Job Modal ===
function openJob(id) {
  const job = jobs.find(j => j.id === id);
  const inst = institutions[job.inst];
  const dl = deadlineText(job.deadline);
  const content = document.getElementById('jobModalContent');
  content.innerHTML = `
    <button class="modal-close" onclick="closeModal('jobModal')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h2>${job.title}</h2>
    ${job.original_title && job.original_title !== job.title ? `<div class="modal-original-title">원문 제목: ${job.original_title}</div>` : ''}
    <div class="modal-institution" onclick="closeModal('jobModal'); openInstitution('${job.inst}')" style="cursor:pointer;">${inst.name} 기관 페이지 보기 →</div>
    <div class="modal-tags">
      <span class="tag">${countryIcon(job.country)} ${job.country}${job.region && job.country !== '온라인' ? ' · ' + job.region : ''}</span>
      <span class="tag">${modeIcon(job.mode)} ${job.mode}</span>
      <span class="tag">🏫 ${job.type}</span>
      <span class="tag">📄 ${job.employment}</span>
    </div>
    <div class="modal-section">
      <h4>핵심 정보</h4>
      <div class="modal-grid">
        <div class="modal-grid-item"><div class="label">기관 유형</div><div class="value">${job.type}</div></div>
        <div class="modal-grid-item"><div class="label">고용 형태</div><div class="value">${job.employment}</div></div>
        <div class="modal-grid-item"><div class="label">급여</div><div class="value">${job.salaryDisclosed ? job.salary : '비공개'}</div></div>
        <div class="modal-grid-item"><div class="label">마감일</div><div class="value" style="color:${dl.urgent?'var(--accent)':'inherit'}">${dl.text}</div></div>
        <div class="modal-grid-item"><div class="label">자격증</div><div class="value">${job.cert}</div></div>
        <div class="modal-grid-item"><div class="label">학위</div><div class="value">${job.degree} 이상</div></div>
        <div class="modal-grid-item"><div class="label">경력</div><div class="value">${job.experience === '신입가능' ? '신입 가능' : '경력 필수'}</div></div>
        <div class="modal-grid-item"><div class="label">비자 지원</div><div class="value">${job.visa ? '지원' : '해당없음'}</div></div>
      </div>
    </div>
    <div class="modal-section">
      <h4>담당 업무</h4>
      <p>${job.desc}</p>
    </div>
    <div class="modal-section">
      <h4>자격 요건</h4>
      <p style="white-space:pre-line;">${job.quals}</p>
    </div>
    <div class="modal-section">
      <h4>우대 사항</h4>
      <p>${job.preferred}</p>
    </div>
    <div class="modal-section">
      <h4>지원 방법</h4>
      <p>${job.apply}</p>
    </div>
    <div style="font-size:12px; color:var(--text-light); margin-bottom:12px;">
      등록: ${job.posted}
    </div>
    <div class="modal-cta">
      <a href="#" class="primary-cta" onclick="alert('시안 데모: 실제로는 원문 채용공고로 이동합니다')">원문 보기 / 지원하기</a>
      <button class="secondary-cta" onclick="alert('시안 데모: 로그인 후 저장 가능')">💾 저장</button>
    </div>
  `;
  document.getElementById('jobModal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

// === Institution Modal ===
function openInstitution(key) {
  const inst = institutions[key];
  const instJobs = jobs.filter(j => j.inst === key);
  const activeJobs = instJobs.filter(j => j.deadline > 0);
  // 과거 공고는 가상으로 생성
  const pastJobs = generatePastJobs(key, inst);

  const allCerts = instJobs.map(j => j.cert);
  const certRate = Math.round(allCerts.filter(c => c==='필수'||c==='우대').length / allCerts.length * 100);

  const content = document.getElementById('instModalContent');
  content.innerHTML = `
    <button class="modal-close" onclick="closeModal('instModal')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="inst-header">
      <div class="inst-logo">${inst.name.charAt(0)}</div>
      <div class="inst-info">
        <h2>${inst.name}</h2>
        <p>${countryIcon(inst.country)} ${inst.country} · ${inst.city} · 🏫 ${inst.type} · 🔗 <a href="https://${inst.website}" target="_blank" style="color:var(--primary-light)">${inst.website}</a></p>
      </div>
    </div>
    <div class="modal-section">
      <p style="font-size:14.5px;">${inst.desc}</p>
    </div>
    <div class="pattern-box">
      <h4>📊 이 기관의 채용 패턴</h4>
      <div class="pattern-grid">
        <div class="pattern-item">
          <div class="num">${instJobs.length + pastJobs.length}</div>
          <div class="label">누적 등록 공고</div>
        </div>
        <div class="pattern-item">
          <div class="num">${activeJobs.length}</div>
          <div class="label">현재 진행 중</div>
        </div>
        <div class="pattern-item">
          <div class="num">${getAvgDeadline(key)}일</div>
          <div class="label">평균 모집 기간</div>
        </div>
        <div class="pattern-item">
          <div class="num">${certRate}%</div>
          <div class="label">교원자격증 필수/우대</div>
        </div>
      </div>
      <p style="font-size:12.5px; color:#92400E; margin-top:12px;">
        💡 이 기관은 주로 <strong>${getHiringSeason(key)}</strong>에 채용을 진행하는 편이에요. 미리 준비해두면 좋아요.
      </p>
    </div>

    <div class="modal-section">
      <h4>현재 진행 중인 채용 (${activeJobs.length}건)</h4>
      <div class="history-list">
        ${activeJobs.length === 0 ? '<p style="color:var(--text-light); font-size:13px;">현재 진행 중인 공고가 없어요. 알림 신청을 해두시면 새 공고가 올라올 때 알려드릴게요.</p>' :
          activeJobs.map(j => `
            <div class="history-item active-job" onclick="closeModal('instModal'); openJob(${j.id})">
              <div class="history-item-left">
                <h5>${j.title}</h5>
                <div class="meta">${j.employment} · ${j.mode} · 마감 D-${j.deadline}</div>
              </div>
              <span class="status-pill active">진행 중</span>
            </div>`).join('')}
      </div>
    </div>

// === 지역 sub-item 자동 생성 (한국 17개 시·도 항상 표시 / 해외는 데이터 있는 국가만) ===
const KR_SIDO_ALL = ['서울','부산','대구','인천','광주','대전','울산','세종','경기','강원','충북','충남','전북','전남','경북','경남','제주'];
function buildRegionFilters() {
  const ovSet = new Set();
  jobs.forEach(job => {
    if (job.country && job.country !== '한국' && job.country !== '온라인') {
      ovSet.add(job.country);
    }
  });
  const krBox = document.getElementById('regionKR');
  const ovBox = document.getElementById('regionOV');
  if (krBox) {
    krBox.innerHTML = KR_SIDO_ALL
      .map(s => `<label class="filter-item" data-keep-empty="1"><input type="checkbox" data-filter="region" value="kr-${s}">${s} <span class="count">0</span></label>`).join('');
  }
  if (ovBox) {
    ovBox.innerHTML = Array.from(ovSet).sort((a,b) => a.localeCompare(b,'ko'))
      .map(c => `<label class="filter-item"><input type="checkbox" data-filter="region" value="ov-${c}">${c} <span class="count">0</span></label>`).join('');
  }
}

// === Sidebar 카운트 자동 계산 + 0건 숨김 + 정렬 ===
function recalcSidebarCounts() {
  document.querySelectorAll('.filter-bar .filter-list').forEach(list => {
    const items = Array.from(list.querySelectorAll('.filter-item'));
    items.forEach(item => {
      const input = item.querySelector('input');
      const key = input.dataset.filter;
      const val = input.value;
      let count = 0;
      jobs.forEach(job => {
        if (key === 'region' && regionMatches(job, val)) count++;
        else if (key === 'employment' && job.employment === val) count++;
        else if (key === 'cert' && job.cert === val) count++;
        else if (key === 'degree' && matchesDegree(job, val)) count++;
        else if (key === 'experience' && job.experience === val) count++;
        else if (key === 'badge' && job.badges && job.badges.includes(val)) count++;
      });
      const countEl = item.querySelector('.count');
      if (countEl) countEl.textContent = count;
      item.dataset.count = count;
      const labelText = (item.textContent || '').replace(/\s*\d+\s*$/, '').trim();
      item.dataset.label = labelText;
      // data-keep-empty 항목(국내 시·도 등)은 0건이어도 표시
      const keepEmpty = item.dataset.keepEmpty === '1';
      item.classList.toggle('is-hidden', count === 0 && !keepEmpty);
    });
    // 카운트 내림차순, 동률은 가나다순
    items.sort((a, b) => {
      const ca = parseInt(a.dataset.count) || 0;
      const cb = parseInt(b.dataset.count) || 0;
      if (cb !== ca) return cb - ca;
      return (a.dataset.label || '').localeCompare(b.dataset.label || '', 'ko');
    });
    items.forEach(item => list.appendChild(item));
  });
  // 지역 그룹 카운트(국내/해외/온라인 합계) 갱신
  let krCount = 0, ovCount = 0, onCount = 0;
  jobs.forEach(job => {
    if (job.country === '한국') krCount++;
    else if (job.country === '온라인') onCount++;
    else ovCount++;
  });
  const groupCounts = [krCount, ovCount, onCount];
  document.querySelectorAll('.region-section').forEach((sec, idx) => {
    const c = sec.querySelector('[data-role="group-count"]');
    if (c) c.textContent = groupCounts[idx] ?? 0;
  });
}

// === 위쪽 칩 0건 숨김 ===
function recalcChipCounts() {
  document.querySelectorAll('.chip[data-quick]').forEach(chip => {
    const q = chip.dataset.quick;
    if (q === 'all') return;
    let count = 0;
    if (q.startsWith('type:')) {
      const t = q.slice(5);
      count = jobs.filter(j => j.type === t && j.category === '강사').length;
    } else if (q === 'admin') count = jobs.filter(j => j.category === '행정·운영').length;
    else if (q === 'publishing') count = jobs.filter(j => j.category === '교재·출판').length;
    else if (q === 'content') count = jobs.filter(j => j.category === '콘텐츠 제작').length;
    else if (q === 'research') count = jobs.filter(j => j.category === '연구·평가').length;
    else if (q === 'policy') count = jobs.filter(j => j.category === '정책·국제교류').length;
    else return;
    // 0건이면 숨김 (mode 토글 시 다시 표시 결정은 별도 처리)
    chip.dataset.zero = count === 0 ? '1' : '0';
    if (count === 0) chip.style.display = 'none';
  });
}

// === 사이드바 input 이벤트 위임 (동적 생성 대응) ===
document.querySelector('.filter-bar').addEventListener('change', (e) => {
  const input = e.target;
  if (!input.matches('.filter-item input[type="checkbox"]')) return;
  const key = input.dataset.filter;
  if (!key) return;
  if (!activeFilters[key]) activeFilters[key] = [];
  if (input.checked) activeFilters[key].push(input.value);
  else activeFilters[key] = activeFilters[key].filter(v => v !== input.value);
  renderGrid();
});


// 드롭다운: 하나 열면 다른 건 닫기 + 바깥 클릭 시 닫기
document.querySelectorAll('.filter-bar details.filter-group').forEach(d => {
  d.addEventListener('toggle', () => {
    if (d.open) {
      document.querySelectorAll('.filter-bar details.filter-group').forEach(other => {
        if (other !== d) other.open = false;
      });
    }
  });
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.filter-bar details.filter-group')) {
    document.querySelectorAll('.filter-bar details.filter-group').forEach(d => d.open = false);
  }
});



// Initial render
buildRegionFilters();
