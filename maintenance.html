<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1F2937">
<title>잠시 점검 중입니다 · K-Teacher Jobs</title>
<meta name="robots" content="noindex">
<meta name="description" content="K-Teacher Jobs는 현재 잠시 점검 중입니다. 곧 다시 찾아뵙겠습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #92400E;
    --accent: #d05a3e;
    --amber: #F59E0B;
    --cream: #FFF7ED;
    --card: #FFFFFF;
    --text: #44403C;
    --muted: #78716C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Sans KR', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(160deg, #FFF7ED 0%, #FEF3C7 100%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(146, 64, 14, 0.12);
    max-width: 440px;
    width: 100%;
    padding: 48px 36px;
    text-align: center;
  }
  .logo {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--primary);
    letter-spacing: -0.3px;
    margin-bottom: 28px;
  }
  .icon { font-size: 56px; line-height: 1; margin-bottom: 20px; }
  h1 {
    font-size: 24px;
    font-weight: 900;
    color: var(--primary);
    margin-bottom: 14px;
    letter-spacing: -0.5px;
  }
  p { font-size: 15px; line-height: 1.7; color: var(--muted); margin-bottom: 8px; }
  .divider { width: 48px; height: 4px; border-radius: 2px; background: var(--amber); margin: 28px auto 24px; }
  .note {
    font-size: 13px;
    color: var(--muted);
    background: var(--cream);
    border-radius: 12px;
    padding: 14px 16px;
    line-height: 1.6;
  }
  .footer { margin-top: 28px; font-size: 12px; color: #A8A29E; }
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <main class="card">
    <div class="logo">K-Teacher Jobs</div>
    <div class="icon">🛠️</div>
    <h1>잠시 점검 중입니다</h1>
    <p>더 나은 서비스를 위해 사이트를 잠시 닫아두었어요.</p>
    <p>준비가 끝나는 대로 다시 찾아뵙겠습니다.</p>
    <div class="divider"></div>
    <div class="note">한국어교육 채용·학회 정보 허브<br>곧 새로워진 모습으로 돌아올게요. 감사합니다 🙏</div>
    <div class="footer">© K-Teacher Jobs</div>
  </main>
</body>
</html>
